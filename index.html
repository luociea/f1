<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Trivia Game</title>
  <!-- PyScript Engine -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="mpy" src="https://pyscript.net/releases/2024.1.1/core.js" config='{"terminal": true}'></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

<script type="mpy" terminal>
import time
import os

def clear_screen():
    os.system('cls' if os.name == 'nt' else 'clear')

drivers = ['max', 'charles', 'oscar']
found_drivers = []
wrong_attempts = 0
tracker = ('Found so far:')

text = "Who are my favorites in F1???"
for char in text:
    print(char, end="", flush=True)
    if char == '?':
        time.sleep(0.3)
    else:
        time.sleep(0.07)
        
time.sleep(1)

while len(found_drivers) < 3:
    clear_screen()
    
    print("Who are my favorites in F1???\n")
    
    print("\n")
    print(f" SCOREBOARD: {len(found_drivers)}/3")
    print("=" * 25 + "\n")
    print("FIRST NAME BASIS ONLY")
    
    if not found_drivers:
        print(f" {tracker} None \n")
    else:
        drivers_list = ', '.join([d.capitalize() for d in found_drivers]) if found_drivers else "None"
        print(f"{tracker} {drivers_list}\n")
    
    if wrong_attempts ==5:
            print("HINT: RED BULL, FERRARI, MCLAREN")
    
    user_input = input("Input a driver's name >>").lower().strip()
    
    if user_input in drivers and user_input not in found_drivers:
        found_drivers.append(user_input)
        print(f" Correct. ({user_input.capitalize()})")
        time.sleep(1)
        
    elif user_input in found_drivers:
        print('You already guessed that driver.')
        time.sleep(1)
    else:
        wrong_attempts +=1
        print('Wrong driver.')
        time.sleep(1)
        
    clear_screen()
    print("You guessed all my drivers!\n")
    if len(found_drivers) == 3:
        print("\n"*2)
        print(f" SCOREBOARD: {len(found_drivers)}/3")
        print("POLE!")
        print("=" * 25 + "\n")
        break
        
</script>

</body>
</html>
